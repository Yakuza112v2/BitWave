[project]
name = "bitwave"
authors = [{ name = "Yakuza112v2" }]
# PEP 440 form of the version reported by bitwave.bitwave_ui.__version__.
# Gemeinsam mit der angezeigten App-Version aktualisieren.
version = "0.2.8"
description = "BitWave: Windows-App zum Offline-Speichern von Musik aus dem eigenen TIDAL-Konto"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[project.urls]
homepage = "https://github.com/Yakuza112v2/BitWave"
repository = "https://github.com/Yakuza112v2/BitWave"
documentation = "https://github.com/Yakuza112v2/BitWave"

[tool.poetry]
packages = [{ include = "bitwave" }]

[tool.poetry.dependencies]
requests = "~2.34.2"
mutagen = "^1.48.1"
dataclasses-json = "^0.6.7"
pathvalidate = "^3.3.1"
m3u8 = "^6.0.0"
# Getestete Qt-Version für die Windows-Ausgaben.
pyside6 = { version = "6.11.1", optional = true }
# Optional on purpose: bitwave_ui.notify degrades to "no banner" without it, and
# Settings shows the notification switch only when it is importable.
desktop-notifier = { version = "^6.2.0", optional = true }
tidalapi = "^0.8.10"
python-ffmpeg = "^2.0.12"
pycryptodome = "^3.23.0"
certifi = ">=2026.7.22"
urllib3 = "^2.8.0"

[project.optional-dependencies]
gui = ["pyside6", "desktop-notifier"]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
deptry = "^0.24.0"
pre-commit = "^4.5.0"
tox = "^4.32.0"
pyupgrade = "^3.21.2"
pillow = "^12.0.0"
black = "^25.11.0"
nuitka = "4.2.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
