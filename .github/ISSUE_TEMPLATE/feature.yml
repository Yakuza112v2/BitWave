name: Verbesserung vorschlagen
description: Schlage eine neue Funktion vor.
body:
  - type: markdown
    attributes:
      value: Bitte prüfe zuerst die vorhandenen Meldungen. BitWave wird ausschließlich für Windows angeboten.
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert oder was wünschst du dir? Nenne bei Fehlern die Schritte zum Nachstellen und das erwartete Ergebnis.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: BitWave-Version
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows-Version und Architektur
      placeholder: Windows 11, x64 oder ARM64
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnosebericht und relevante Einstellungen
      description: Bei Fehlern unter Einstellungen → Diagnose einen bereinigten Bericht exportieren und hier anhängen. Keine Zugangsdaten oder unbearbeiteten Einstellungsdateien einfügen.
