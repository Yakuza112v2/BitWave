name: "setup-poetry-env"
description: "Composite action to setup the Python and poetry environment."

inputs:
  python-version:
    required: false
    description: "The python version to use"
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        virtualenvs-in-project: true
        virtualenvs-create: true
        installer-parallel: true

    # Große Abhängigkeiten bei abgebrochener Übertragung erneut laden.
    - name: Install dependencies
      run: |
        set -u
        for attempt in 1 2 3; do
          if poetry install --no-interaction --all-extras --with dev; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::poetry install failed after $attempt attempts"
            exit 1
          fi
          echo "::warning::poetry install failed (attempt $attempt); clearing the cache and retrying"
          poetry cache clear --all --no-interaction pypi || true
          sleep $((attempt * 15))
        done
      shell: bash
