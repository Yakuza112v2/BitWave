name: Import reviewed BitWave migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned Waves source and apply BitWave changes
        shell: bash
        run: |
          set -euo pipefail
          cp bitwave-migration.patch "$RUNNER_TEMP/bitwave-migration.patch"
          git fetch https://github.com/iamprivacy/Waves.git main
          git cat-file -e 1fd28b9f296d68cd2bd3704e75dbb58f888d4cbe^{commit}
          git switch -c import-bitwave 1fd28b9f296d68cd2bd3704e75dbb58f888d4cbe
          git apply --check "$RUNNER_TEMP/bitwave-migration.patch"
          git apply "$RUNNER_TEMP/bitwave-migration.patch"
          git rm -r .github
          git checkout origin/main -- .github
          git config user.name "BitWave migration"
          git config user.email "103038143+Yakuza112v2@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand Waves as independent BitWave application"
          git merge -s ours --allow-unrelated-histories origin/main -m "Join private BitWave setup with upstream history"
          git push origin HEAD:main
