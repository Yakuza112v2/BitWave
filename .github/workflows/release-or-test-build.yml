# BitWave: ausschließlich Windows x64 und ARM64.
name: release-or-test-build
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: true
env:
  ASSET_EXTENSION: .zip
  OUT_NAME_FILE: bitwave
  ARCH_WINDOWS_X64: windows-x64
  ARCH_WINDOWS_ARM64: windows-arm64
jobs:
  compute:
    if: github.repository == 'Yakuza112v2/BitWave' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      ASSET_EXTENSION: ${{ env.ASSET_EXTENSION }}
      OUT_NAME_FILE: ${{ env.OUT_NAME_FILE }}
      ARCH_WINDOWS_X64: ${{ env.ARCH_WINDOWS_X64 }}
      ARCH_WINDOWS_ARM64: ${{ env.ARCH_WINDOWS_ARM64 }}
    steps:
    - name: Compute outputs
      run: |
        echo "ASSET_EXTENSION=${{ env.ASSET_EXTENSION }}" >> $GITHUB_OUTPUT
        echo "OUT_NAME_FILE=${{ env.OUT_NAME_FILE }}" >> $GITHUB_OUTPUT
        echo "ARCH_WINDOWS_X64=${{ env.ARCH_WINDOWS_X64 }}" >> $GITHUB_OUTPUT
        echo "ARCH_WINDOWS_ARM64=${{ env.ARCH_WINDOWS_ARM64 }}" >> $GITHUB_OUTPUT
    - name: Check out (release-config guard)
      if: ${{ (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.release_tag != '') }}
      uses: actions/checkout@v4
    - name: Guard, a published release must be able to self-update
      if: ${{ (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.release_tag != '') }}
      run: |
        grep -Eq '^REPO = "[^"]+"' bitwave/bitwave_ui/updater.py \
          || { echo "::error::updater.REPO is empty; a published build could never auto-update. Set REPO before tagging a release."; exit 1; }
        grep -Eq '^UPDATE_PUBLIC_KEY = "[^"]+"' bitwave/bitwave_ui/signing.py \
          || { echo "::error::signing.UPDATE_PUBLIC_KEY is empty; shipped updates could not be signature-verified. Embed UPDATE_PUBLIC_KEY before tagging a release."; exit 1; }
        echo "Updater is configured; release build may proceed."
    - name: Guard, release tag matches __version__
      if: ${{ (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.release_tag != '') }}
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      run: |
        TAG_VERSION="${RELEASE_TAG#v}"
        CODE_VERSION="$(grep -m1 '__version__' bitwave/bitwave_ui/__init__.py | tr -d ' "' | cut -d'=' -f2)"
        if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
          echo "::error::release tag '$RELEASE_TAG' (version '$TAG_VERSION') does not match bitwave/bitwave_ui/__init__.py __version__ '$CODE_VERSION'. Bump __version__ to match the tag before releasing."
          exit 1
        fi
        echo "Version $CODE_VERSION matches release tag $RELEASE_TAG."
    - name: Guard, a release builds both Windows architectures
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.only
        != '' }}
      run: |
        echo "::error::Bei einem Release muss only leer bleiben, damit beide Windows-Varianten veröffentlicht werden."
        exit 1
    - name: Guard, dispatch release commit is on the default branch
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git fetch --quiet origin "$DEFAULT_BRANCH"
        if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/$DEFAULT_BRANCH"; then
          echo "::error::commit ${{ github.sha }} is not on $DEFAULT_BRANCH; refusing to publish a release from an unmerged ref. Merge into $DEFAULT_BRANCH first, then dispatch the release."
          exit 1
        fi
        echo "Dispatched commit is on $DEFAULT_BRANCH; release build may proceed."
  create-release:
    needs:
    - compute
    if: ${{ (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-24.04
    steps:
    - name: Create the Release (empty draft, assets attached by the matrix)
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        draft: true
  build:
    needs:
    - compute
    - create-release
    if: always() && needs.compute.result == 'success' && needs['create-release'].result != 'failure' && needs['create-release'].result
      != 'cancelled' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/test-build' || github.event_name
      == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          TARGET: windows-2022
          OS_ARCH: ${{needs.compute.outputs.ARCH_WINDOWS_X64}}
          CMD_BUILD: |
            choco install zip make -y && source $VENV && poetry run make gui-bitwave-windows && cd dist && mv bitwave.dist BitWave && zip -9 -r ${{needs.compute.outputs.OUT_NAME_FILE}}_${{needs.compute.outputs.ARCH_WINDOWS_X64}}${{needs.compute.outputs.ASSET_EXTENSION}} BitWave && cd ..
        - os: windows-11-arm
          TARGET: windows-11-arm
          OS_ARCH: ${{needs.compute.outputs.ARCH_WINDOWS_ARM64}}
          CMD_BUILD: |
            choco install zip make -y && source $VENV && poetry run make gui-bitwave-windows && cd dist && mv bitwave.dist BitWave && zip -9 -r ${{needs.compute.outputs.OUT_NAME_FILE}}_${{needs.compute.outputs.ARCH_WINDOWS_ARM64}}${{needs.compute.outputs.ASSET_EXTENSION}} BitWave && cd ..
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH) }}
      uses: actions/checkout@v4
    - name: Set up the environment
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH) }}
      uses: ./.github/actions/setup-poetry-env
    - name: Build BitWave for ${{matrix.TARGET}}
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH) }}
      run: ${{matrix.CMD_BUILD}}
    - name: Smoke-launch trimmed bundle
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH)) && !endsWith(matrix.OS_ARCH, '-arm64') }}
      env:
        QT_QPA_PLATFORM: offscreen
        QT_OPENGL: software
      run: |
        set -u
        BIN="dist/BitWave/BitWave.exe"
        if [ ! -e "$BIN" ]; then
          echo "::error::smoke-launch: built binary '$BIN' not found"; exit 1
        fi
        echo "Smoke-launching $BIN (offscreen)…"
        "$BIN" &
        APP_PID=$!
        ok=0
        # Poll for ~15s: success = still alive (a healthy long-running GUI);
        # failure = exited early with a non-zero status.
        for _ in $(seq 1 15); do
          sleep 1
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID"; rc=$?
            if [ "$rc" -eq 0 ]; then ok=1; else
              echo "::error::smoke-launch: $BIN exited early with status $rc (trimmed bundle fails to start)"; exit 1
            fi
            break
          fi
        done
        if kill -0 "$APP_PID" 2>/dev/null; then
          echo "smoke-launch: still running after startup window; healthy."
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          ok=1
        fi
        [ "$ok" -eq 1 ] || { echo "::error::smoke-launch: $BIN never reached a healthy state"; exit 1; }
    - name: Checksum
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH) }}
      run: |
        cd dist
        BASE="${{needs.compute.outputs.OUT_NAME_FILE}}_${{matrix.OS_ARCH}}"
        for ASSET in "${BASE}${{needs.compute.outputs.ASSET_EXTENSION}}"; do
          [ -e "$ASSET" ] || continue
          python -c "import hashlib,sys; p=sys.argv[1]; open(p+'.sha256','w',newline=chr(10)).write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+chr(10))" "$ASSET"
          cat "$ASSET.sha256"
        done
    - name: Upload checksum artifact
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only,
        matrix.OS_ARCH) }}
      uses: actions/upload-artifact@v4
      with:
        name: sha256-${{matrix.OS_ARCH}}
        path: ./dist/${{needs.compute.outputs.OUT_NAME_FILE}}_${{matrix.OS_ARCH}}*.sha256
    - name: Upload Build Artifact (workflow_dispatch / test-build)
      if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/test-build') && (github.event_name !=
        'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only, matrix.OS_ARCH)) }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{needs.compute.outputs.OUT_NAME_FILE}}_${{matrix.OS_ARCH}}
        path: ./dist/${{needs.compute.outputs.OUT_NAME_FILE}}_${{matrix.OS_ARCH}}${{needs.compute.outputs.ASSET_EXTENSION}}
    - name: Upload Release Asset
      if: ${{ ((github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.release_tag != '')) && (github.event_name != 'workflow_dispatch' || github.event.inputs.only
        == '' || contains(github.event.inputs.only, matrix.OS_ARCH)) }}
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        fail_on_unmatched_files: true
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        draft: true
        files: |
          ./dist/${{needs.compute.outputs.OUT_NAME_FILE}}_${{matrix.OS_ARCH}}*
  sign-manifest:
    needs:
    - compute
    - build
    if: ${{ (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-24.04
    steps:
    - name: Check out
      uses: actions/checkout@v4
    - name: Set up the environment
      uses: ./.github/actions/setup-poetry-env
    - name: Collect per-asset checksums
      uses: actions/download-artifact@v4
      with:
        pattern: sha256-*
        merge-multiple: true
        path: sums
    - name: Build SHA256SUMS manifest
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      run: |
        { echo "# bitwave-version: ${RELEASE_TAG}"; cat sums/*.sha256 | LC_ALL=C sort -k2; } > SHA256SUMS
        echo "----- SHA256SUMS -----"; cat SHA256SUMS
    - name: Sign SHA256SUMS
      env:
        BITWAVE_SIGNING_KEY: ${{ secrets.BITWAVE_SIGNING_KEY }}
      run: |
        if [ -n "$BITWAVE_SIGNING_KEY" ]; then
          source $VENV
          poetry run python tools/sign_manifest.py SHA256SUMS SHA256SUMS.sig
        else
          echo "::error::BITWAVE_SIGNING_KEY is not set; a tagged release MUST be signed or the in-app updater (fail-closed) will refuse every update. Add the BITWAVE_SIGNING_KEY secret before tagging."
          exit 1
        fi
    - name: Extract release notes from CHANGELOG.md
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      run: |
        awk -v tag="$RELEASE_TAG" '
          # Match the tag as any field on a "## " heading, so an optional emoji
          # accent (e.g. "## 🌊 v0.1.1 (date)") does not shift it off field 2.
          /^## / { on = 0; for (i = 2; i <= NF; i++) if ($i == tag) on = 1; next }
          on && (started || NF) { started = 1; print }
        ' CHANGELOG.md > RELEASE_NOTES.md
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "::warning::CHANGELOG.md has no '## ${RELEASE_TAG}' section; the Release body carries only the Verify footer."
        fi
        # The Verify footer: every asset's expected hash next to the download,
        # the release public key and the copyable check, generated from the
        # manifest just signed so the page can never disagree with it.
        source $VENV
        { echo; poetry run python tools/release_verify_notes.py SHA256SUMS; } >> RELEASE_NOTES.md
        echo "----- RELEASE_NOTES.md -----"; cat RELEASE_NOTES.md
    - name: Set release notes body
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      run: |
        if [ -s RELEASE_NOTES.md ]; then
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
        fi
    - name: Publish manifest + signature
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        fail_on_unmatched_files: false
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        body_path: RELEASE_NOTES.md
        draft: false
        files: |
          SHA256SUMS
          SHA256SUMS.sig
'on':
  push:
    tags:
    - v*.*.*
    branches:
    - test-build
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release unter diesem Tag veröffentlichen, z. B. v0.2.2. Leer = nur Testpakete.
        required: false
        default: ''
      only:
        description: 'Testbuild: windows-x64 oder windows-arm64. Leer = beide Windows-Varianten. Bei einem Release leer lassen.'
        required: false
        default: ''
