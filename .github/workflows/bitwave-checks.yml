name: BitWave prüfen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-poetry-env
        with:
          python-version: '3.13'
      - name: Paket und feste Abhängigkeiten prüfen
        run: poetry check --lock
      - name: Python-Dateien prüfen
        run: poetry run python -m compileall -q bitwave .github/build bitwave.py
      - name: Veröffentlichungshelfer laden
        run: poetry run python .github/build/publish_windows_release.py --help
