name: BitWave checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-checks:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libpulse0 libasound2t64
      - uses: ./.github/actions/setup-poetry-env
        with:
          python-version: '3.13'
      - name: Check package and lock file
        run: poetry check --lock
      - name: Check independent identity, signing, updates and QML
        run: >-
          poetry run pytest -q
          tests/test_settings_fit.py
          tests/test_notify_downloads.py
          tests/test_releases_backend.py
          tests/test_bitwave_german.py
          tests/test_bitwave_branding.py
          tests/test_bitwave_identity.py
          tests/test_config_path.py
          tests/test_signing.py
          tests/test_package_version.py
          tests/test_updater.py
          tests/test_audit_updater.py
          tests/test_updater_integration.py
          tests/test_release_verify_notes.py
          tests/test_update_optin_prompt.py
          tests/test_update_check_teardown.py
          tests/test_update_check_failure_wording.py
          tests/test_qml_loads.py
          tests/test_offscreen_qt_is_usable.py
